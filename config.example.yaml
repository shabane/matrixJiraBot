# matrix-jira-bot configuration
#
# Copy this file to config.yaml and fill in your real values.
# config.yaml is gitignored and should NEVER be committed.

matrix:
  homeserver: "https://matrix.example.org"
  user_id: "@bot:example.org"
  access_token: "syt_xxx"   # long-lived access token for the bot's Matrix account
  device_id: ""              # optional; leave blank to let the server assign one

  # One entry per Matrix room the bot should listen in.
  #
  # project_key is optional. Set it for a room dedicated to one board, so
  # "/ticket @user ..." just works without naming a project. Leave it unset
  # for a room shared across multiple boards -- /ticket then requires the
  # project explicitly: "/ticket CK @user ...". /comment, /assign, and
  # /status are unaffected either way since they take an issue key, which
  # already says which project it belongs to.
  rooms:
    - room_id: "!aaaaaaaaaaaaaaaaaa:example.org"
      project_key: "CK"
      name: "Kanban board"      # for logging only, not required by the bot
    - room_id: "!bbbbbbbbbbbbbbbbbb:example.org"
      project_key: "CLM"
      name: "CLM scrum board"
    # Example of a single shared room covering every board -- no project_key:
    # - room_id: "!cccccccccccccccccc:example.org"
    #   name: "All Jira activity"

jira:
  url: "https://jira.example.org"
  # Personal Access Token (Jira Server/Data Center), sent as: Authorization: Bearer <token>
  token: "xxx"
  default_issue_type: "Task"

# Any of these prefixes marks a message as a command. A message is checked
# against each one in order; the first match wins.
command_prefixes:
  - "/"
  - "!"

# Maps a short @alias (used in /ticket and /assign, and matched against
# real Matrix mentions when your client sends them) to a Matrix user ID
# and the corresponding Jira username.
users:
  - alias: "honarkar"
    matrix_id: "@honarkar:example.org"
    jira_username: "honarkar"
  - alias: "arya"
    matrix_id: "@arya:example.org"
    jira_username: "shabane"
